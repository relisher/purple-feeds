name: Build

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libpurple-dev libglib2.0-dev pkg-config
      - name: Build
        run: make
      - name: Test parser
        run: make check
      - uses: actions/upload-artifact@v7
        with:
          name: libfeeds-linux
          path: libfeeds.so
